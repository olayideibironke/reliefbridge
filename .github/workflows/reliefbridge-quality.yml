name: ReliefBridge Quality Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Billing and case-capacity tests
        run: npm run test:billing
      - name: Capacity SQL static safety checks
        run: node scripts/check-capacity-migrations.cjs
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Feature ESLint (required)
        run: npx eslint src/lib/billing-packages.ts src/lib/billing-entitlements.ts src/lib/billing-entitlements.test.ts src/lib/case-capacity.ts src/lib/case-capacity.test.ts src/app/request-quote src/app/app/settings/billing/page.tsx
      - name: Repository ESLint (existing backlog, informational)
        continue-on-error: true
        run: npm run lint

  postgres-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reliefbridge_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: reliefbridge_capacity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reliefbridge_test -d reliefbridge_capacity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute capacity migrations and integration assertions in disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: reliefbridge_test
          PGPASSWORD: local_test_only
          PGDATABASE: reliefbridge_capacity_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/validation/capacity_integration.sql
